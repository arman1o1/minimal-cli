[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-cli"
version = "0.1.2"
description = "A lightweight coding agent powered by Gemini"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "minimal-cli contributors" }]
dependencies = [
  "google-genai>=1.0.0",
  "rich>=13.0.0",
  "click>=8.1.0",
  "httpx>=0.27.0",
  "markdownify>=0.13.0",
  "prompt_toolkit>=3.0.0",
  "pathspec>=0.12.0",
  "beautifulsoup4>=4.12.0",
]

[project.scripts]
minimal-cli = "minimal_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".test-workspaces",
  ".uv-cache",
  ".uv-python",
  ".uv-test-313",
  ".uv-test-env",
  ".venv",
  "build",
  "uv-cache",
]
